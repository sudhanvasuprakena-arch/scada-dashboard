<div class="container">
  <div class="row" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px);">
    <div class="col-md-5">
      <div class="card">
        <div class="card-header bg-primary text-white text-center" style="padding: 15px 20px;">
          <h4><i class="fa fa-key"></i> Reset Password</h4>
          <p style="margin: 0; font-size: 13px;">BAMUL Customer Master Portal</p>
        </div>
        <div class="card-body" style="padding: 30px;">

          <!-- STEP 1: Validate Username + Email -->
          <div *ngIf="!validated">
            <div class="form-group">
              <label>Username <span class="text-danger">*</span></label>
              <input type="text" class="form-control" [(ngModel)]="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
              <label>Email ID <span class="text-danger">*</span></label>
              <input type="email" class="form-control" [(ngModel)]="emailId" placeholder="Enter registered email">
            </div>

            <div *ngIf="message" class="alert" [ngClass]="{'alert-danger': messageType === 'danger'}" style="font-size: 13px;">{{ message }}</div>

            <button class="btn btn-primary btn-block" (click)="validateUser()" [disabled]="loading || !username || !emailId" style="padding: 12px; font-size: 16px;">
              <i class="fa fa-check" *ngIf="!loading"></i>
              <i class="fa fa-spinner fa-spin" *ngIf="loading"></i>
              {{ loading ? 'Validating...' : 'Validate & Proceed' }}
            </button>
          </div>

          <!-- STEP 2: Change Password -->
          <div *ngIf="validated">
            <div class="alert alert-success" style="font-size: 13px;">
              <i class="fa fa-check-circle"></i> User validated: <strong>{{ username }}</strong>
            </div>

            <div class="form-group">
              <label>Old Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" [(ngModel)]="oldPassword" placeholder="Enter current password">
            </div>
            <div class="form-group">
              <label>New Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" [(ngModel)]="newPassword" placeholder="Min 6 characters">
            </div>
            <div class="form-group">
              <label>Confirm New Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" [(ngModel)]="confirmNewPassword" placeholder="Re-enter new password">
            </div>

            <div *ngIf="message" class="alert" [ngClass]="{'alert-success': messageType === 'success', 'alert-danger': messageType === 'danger'}" style="font-size: 13px;">{{ message }}</div>

            <button class="btn btn-primary btn-block" (click)="changePassword()" [disabled]="loading" style="padding: 12px; font-size: 16px;">
              <i class="fa fa-key" *ngIf="!loading"></i>
              <i class="fa fa-spinner fa-spin" *ngIf="loading"></i>
              {{ loading ? 'Updating...' : 'Change Password' }}
            </button>
          </div>

          <p class="text-center" style="margin-top: 15px; font-size: 13px;">
            <a routerLink="/login" style="color: #1a73e8; font-weight: 600;">Back to Login</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</div>
