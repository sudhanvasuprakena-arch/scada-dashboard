<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Milk Usage — Bangalore Main Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563EB;
  --blue-deep:#1D4ED8;
  --blue-ink:#0B1B3F;
  --milk:#F5F8FF;
  --sky:#E8EFFD;
  --sky-line:#D5E2FA;
  --pipe:#4A78E0;
  --card:#FFFFFF;
  --text:#233355;
  --muted:#6B7CA3;
  --green:#0E9F6E;
  --green-soft:#E3F6EE;
  --sun1:#FFC93C;
  --sun2:#F5821F;
  --radius:14px;
  --shadow:0 1px 2px rgba(11,27,63,.05), 0 6px 18px -10px rgba(37,99,235,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:300%;overflow-x:hidden;margin:0;padding:0;height:100%}
html,body{width:100%;overflow-x:hidden;margin:0;padding:0;height:auto;margin:0;padding:0}
body{width:100%;overflow-x:hidden;margin:0;padding:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--milk);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
}
h1,h3{font-family:'Bricolage Grotesque','Inter',sans-serif}
.num{font-variant-numeric:tabular-nums}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ===== Top bar ===== */
.topbar{background:var(--card);border-bottom:1px solid var(--sky-line);flex:none}
.topbar-inner{
  max-width:100%;margin:0;width:100%;padding:6px 24px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(140deg,var(--blue),var(--blue-deep));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 3px 10px -3px rgba(37,99,235,.5);
}
.brand-mark svg{width:18px;height:18px}
.brand h1{font-size:28px;font-weight:800;color:var(--blue-ink);letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.brand p{font-size:18px;color:var(--muted);font-weight:500;white-space:nowrap}
.live-dot{
  display:inline-flex;align-items:center;gap:5px;font-size:16px;font-weight:600;
  color:var(--green);background:var(--green-soft);border-radius:99px;padding:3px 9px;
}
.live-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.range-pills{display:flex;gap:4px;background:var(--sky);padding:3px;border-radius:10px;margin-left:auto}
.pill{
  font:inherit;font-size:16px;font-weight:600;color:var(--muted);
  border:none;background:transparent;border-radius:7px;padding:5px 12px;cursor:pointer;transition:.15s;
}
.pill:hover{color:var(--blue-deep)}
.pill.active{background:#fff;color:var(--blue-deep);box-shadow:0 1px 4px rgba(11,27,63,.12)}
.btn{
  font:inherit;font-size:16px;font-weight:600;cursor:pointer;border-radius:9px;
  padding:7px 13px;border:1px solid var(--sky-line);background:var(--card);color:var(--blue-ink);
  transition:.15s;white-space:nowrap;text-decoration:none;display:inline-block;
}
.btn:hover{background:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep)}

/* ===== Radial stage ===== */
.stage-wrap{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:10px}
.stage{position:relative}
.rays{position:absolute;inset:0;pointer-events:none}
.rays line{
  stroke:#1A1A1A;stroke-width:3;stroke-dasharray:7 7;stroke-linecap:round;
  animation:raymove 1.4s linear infinite;
}
@keyframes raymove{to{stroke-dashoffset:-28}}
.rays polygon{fill:#1A1A1A}

/* Sun (center) */
.sun{
  position:absolute;z-index:3;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #5B8DF6 0%, var(--blue) 55%, var(--blue-deep) 90%);
  box-shadow:
    0 0 0 10px rgba(37,99,235,.14),
    0 0 0 22px rgba(37,99,235,.06),
    0 14px 40px -10px rgba(29,78,216,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:#fff;padding:18px;
  animation:sunbreathe 4s ease-in-out infinite;
}
@keyframes sunbreathe{
  0%,100%{box-shadow:0 0 0 10px rgba(37,99,235,.14),0 0 0 22px rgba(37,99,235,.06),0 14px 40px -10px rgba(29,78,216,.55)}
  50%{box-shadow:0 0 0 16px rgba(37,99,235,.17),0 0 0 32px rgba(37,99,235,.07),0 14px 44px -8px rgba(29,78,216,.6)}
}
.sun .cap{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.92}
.sun .v{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:clamp(28px,3vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:3px;
  text-shadow:0 2px 8px rgba(6,22,68,.35);
}
.sun .v small{font-size:.48em;font-weight:700;opacity:.9;margin-left:2px}
.sun .sub{font-size:13px;font-weight:600;opacity:.85;margin-top:3px}

/* Product nodes */
.node{
  position:absolute;z-index:2;transform:translate(-50%,-50%);
  width:var(--nodeD,118px);height:var(--nodeD,118px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff 0%, var(--sky) 90%);
  border:2px solid var(--sky-line);
  box-shadow:0 1px 2px rgba(11,27,63,.05),0 10px 24px -12px rgba(37,99,235,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:8px;overflow:hidden;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.node:hover{transform:translate(-50%,-50%) scale(1.06);border-color:var(--blue);box-shadow:0 2px 4px rgba(11,27,63,.06),0 14px 30px -12px rgba(37,99,235,.45)}
.node .nm{font-size:14px;font-weight:800;color:var(--blue-ink);line-height:1.15;max-width:92%}
.node .kg{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:800;color:var(--muted);line-height:1.25;white-space:nowrap;margin-top:2px}
.node .kg small{font-size:13px;font-weight:600;margin-left:1px}
.node .cap2{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}

/* Reveal */
.reveal{opacity:0;animation:fadein .6s ease forwards}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1}
}
/* ===== Responsive =====
   Keep the radial "sun + rays" design at every size — just scale it down.
   The stage is scaled with a CSS transform so all proportions, the circle
   overlaps, and the ray geometry stay exactly as designed. */
@media (max-width:1100px){
  /* Top bar wraps — this page carries pills plus 3 buttons */
  .topbar-inner{flex-wrap:wrap;gap:8px 12px}
  .range-pills{margin-left:0;order:5}
}
@media (max-width:900px){
  html,body{width:100%;overflow-x:hidden;margin:0;padding:0;height:auto;margin:0;padding:0}
  body{width:100%;overflow-x:hidden;margin:0;padding:0;overflow:auto}
  /* Allow vertical room for the scaled stage and keep it centred */
  .stage-wrap{min-height:70vh;padding:10px 6px 24px;overflow-x:hidden}
  .stage{transform:scale(.78);transform-origin:center center}
}
@media (max-width:620px){
  .range-pills{width:100%;justify-content:space-between;margin-left:0}
  .pill{flex:1;text-align:center;padding:6px 6px}
  .topbar-inner .btn{flex:1 1 auto;text-align:center}
  .stage{transform:scale(.62)}
}
@media (max-width:420px){
  .brand p{display:none}
  .stage{transform:scale(.5)}
}
</style>
</head>
<body>

<!-- ===== Top bar ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c3.5 4.6 6.5 8 6.5 12a6.5 6.5 0 1 1-13 0c0-4 3-7.4 6.5-12Z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/></svg>
      </div>
      <div>
        <h1>Milk Usage · Products</h1>
        <p>Procurement → product-wise usage</p>
      </div>
    </div>
    <span class="live-dot">Live</span>
    <div class="range-pills" role="tablist" aria-label="Date range">
      <button class="pill" role="tab" aria-selected="false" data-filter="yesterday">Yesterday</button>
      <button class="pill" role="tab" aria-selected="false" data-filter="today">Today</button>
      <button class="pill active" role="tab" aria-selected="true" data-filter="month">This month</button>
      <button class="pill" role="tab" aria-selected="false" data-filter="week">This week</button>
    </div>
    <a class="btn" href="./predairy/index.html">Procurement view</a>
    <a class="btn" id="back-btn" href="./bangalore-dairy-dashboard.html">Plant flow →</a>
    <button class="btn primary">Logout</button>
  </div>
</header>

<!-- ===== Sun & rays ===== -->
<main class="stage-wrap" aria-label="Milk usage radial view">
  <div class="stage" id="stage">
    <svg class="rays" id="rays" aria-hidden="true"></svg>
    <div class="sun reveal" id="sun">
      <div class="cap">Total Milk Procurement</div>
      <div class="v num" id="sunVal">—<small>Kg</small></div>
      <div class="sub">Used across 8 products</div>
    </div>
    <!-- product nodes injected by JS -->
  </div>
</main>

<script>
const BASE_URL = '';
function n2(v){ return parseFloat(v||0); }
function formatIN(n){ return n.toLocaleString('en-IN'); }

const products = [
  { name: "Milk Packets", kg: null },
  { name: "Curd Packets", kg: null },
  { name: "Butter",       kg: null },
  { name: "Ghee",         kg: null },
  { name: "Peda",         kg: null },
  { name: "Mysore Pak",   kg: null },
  { name: "Paneer",       kg: null },
  { name: "Khova",        kg: null },
];

function getActiveFilter(){
  const a = document.querySelector('.pill.active');
  return a ? (a.dataset.filter||'month') : 'month';
}

async function loadSun(){
  try{
    const res = await fetch(`${BASE_URL}/papi/bangalore/milk-procurement-summary?filter=${getActiveFilter()}`);
    const json = await res.json();
    if(json.success){
      document.getElementById('sunVal').innerHTML = formatIN(Math.round(n2(json.totalReceived)))+'<small>Kg</small>';
    }
  }catch(e){}
}

const stage = document.getElementById('stage');
const svg = document.getElementById('rays');
const sun = document.getElementById('sun');
document.getElementById('sunVal').innerHTML = '—<small>Kg</small>';

let nodes = [];
function build(){
  const wrapW = stage.parentElement.clientWidth - 20;
  const wrapH = stage.parentElement.clientHeight - 20;
  const W = Math.min(wrapW, 1400), H = Math.min(wrapH, 760);
  stage.style.width = W+'px'; stage.style.height = H+'px';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.innerHTML = '';

  const sunR = Math.min(W,H)*0.17*0.7;
  const cx = sunR + 70 + W*0.20, cy = H/2;
  sun.style.width = sun.style.height = (sunR*2)+'px';
  sun.style.left = cx+'px'; sun.style.top = cy+'px';

  const nodeD = Math.max(96, Math.min(130, Math.min(W,H)*0.17));
  stage.style.setProperty('--nodeD', nodeD+'px');

  const spreadDeg = 120;
  const maxR_x = W - cx - nodeD/2 - 40;
  const maxR_y = (H/2 - nodeD/2 - 10) / Math.sin(spreadDeg/2 * Math.PI/180);
  const R = Math.min(maxR_x, maxR_y);

  if(!nodes.length && products.length){
    products.forEach((p,i)=>{
      const el = document.createElement('div');
      el.className = 'node reveal';
      el.style.animationDelay = (0.15+i*0.07)+'s';
      el.innerHTML = `<div class="nm">${p.name}</div><div class="kg num">${p.kg==null?'—':formatIN(p.kg)}<small>Kg</small></div><div class="cap2">Dispatched</div>`;
      stage.appendChild(el);
      nodes.push(el);
    });
  }

  const count = products.length || 1;
  products.forEach((p,i)=>{
    const start = -spreadDeg/2;
    const ang = (start + i*(spreadDeg/(count-1||1))) * Math.PI/180;
    const nx = cx + R*Math.cos(ang);
    const ny = cy + R*Math.sin(ang);
    if(nodes[i]){ nodes[i].style.left = nx+'px'; nodes[i].style.top = ny+'px'; }
    const dx = nx-cx, dy = ny-cy, len = Math.hypot(dx,dy);
    const ux = dx/len, uy = dy/len;
    const x1 = cx+ux*(sunR+8), y1 = cy+uy*(sunR+8);
    const x2 = nx-ux*(nodeD/2+10), y2 = ny-uy*(nodeD/2+10);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    svg.appendChild(line);
    const ah=9,aw=6,px=-uy,py=ux;
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points',`${x2+ux*ah},${y2+uy*ah} ${x2+px*aw},${y2+py*aw} ${x2-px*aw},${y2-py*aw}`);
    svg.appendChild(poly);
  });
}

loadSun();
build();
window.addEventListener('resize', build);

document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')});
    p.classList.add('active'); p.setAttribute('aria-selected','true');
    loadSun();
  });
});
</script>
<script>(function(){function upd(){var b=document.getElementById("back-btn");if(!b)return;var h=b.getAttribute("href").split("?")[0];b.setAttribute("href",h+"?filter="+getActiveFilter());}document.querySelectorAll(".pill").forEach(function(p){p.addEventListener("click",upd);});var ab=document.getElementById("applyRange");if(ab)ab.addEventListener("click",upd);upd();})();</script>
</body>
</html>
