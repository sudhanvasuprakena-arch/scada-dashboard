name: Deploy to OCI

on:
  push:
    branches:
      - latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            REPO=/opt/scada-dashboard
            WEB=/var/www/bangalore-dairy-dashboard

            cd "$REPO"
            sudo git fetch origin latest
            sudo git reset --hard origin/latest

            sudo cp "$REPO"/*.html "$WEB"/

            # Pre-dairy pages live in a subfolder; the root glob above does not
            # recurse, so copy them explicitly.
            sudo mkdir -p "$WEB"/predairy
            sudo cp "$REPO"/predairy/*.html "$WEB"/predairy/

            for f in "$REPO"/*.html "$REPO"/predairy/*.html; do
              rel=${f#"$REPO"/}
              if ! sudo cmp -s "$f" "$WEB/$rel"; then
                echo "DEPLOY VERIFICATION FAILED: $rel does not match repo"
                exit 1
              fi
            done

            echo "$(date --iso-8601=seconds) | Deployed + verified from GitHub Actions" | sudo tee -a /home/opc/deploy.log
