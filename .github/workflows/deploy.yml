name: Deploy to OCI

on:
  push:
    branches:
      - latest

jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd /opt/scada-dashboard
            sudo git pull origin latest
            sudo cp -r *.html /var/www/bangalore-dairy-dashboard/
            echo "$(date --iso-8601=seconds) | Dashboard deployed from GitHub Actions" >> /home/opc/deploy.log


      
