export default "<nav *ngIf=\"showNav\" class=\"navbar navbar-default navbar-fixed-top\" style=\"background-color: #1a73e8; border: none;\">\n  <div class=\"container-fluid\">\n    <div class=\"navbar-header\">\n      <a class=\"navbar-brand\" style=\"color: white; font-weight: bold; font-size: 18px;\">\n        <i class=\"fa fa-building\"></i> BAMUL - Customer Master Portal\n      </a>\n    </div>\n    <ul class=\"nav navbar-nav navbar-right\">\n      <li><a routerLink=\"/customer-form\" style=\"color: white;\"><i class=\"fa fa-user-plus\"></i> Customer Form</a></li>\n      <li><a routerLink=\"/customer-update\" style=\"color: white;\"><i class=\"fa fa-edit\"></i> Update Customer</a></li>\n      <li><a routerLink=\"/my-submissions\" style=\"color: white;\"><i class=\"fa fa-list\"></i> My Submissions</a></li>\n      <li *ngIf=\"userRole === 'MASTER'\"><a routerLink=\"/admin-approval\" style=\"color: white;\"><i class=\"fa fa-users\"></i> Employee Approval</a></li>\n      <li *ngIf=\"userRole === 'MASTER'\"><a routerLink=\"/finance-approval\" style=\"color: white;\"><i class=\"fa fa-check-circle\"></i> Customer Approval</a></li>\n      <li><a href=\"javascript:void(0)\" (click)=\"logout()\" style=\"color: white;\"><i class=\"fa fa-sign-out\"></i> Logout</a></li>\n    </ul>\n  </div>\n</nav>\n\n<div [style.margin-top]=\"showNav ? '60px' : '0'\">\n  <router-outlet></router-outlet>\n</div>\n"
