export default "<div class=\"container\">\n  <div class=\"row\" style=\"display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px);\">\n    <div class=\"col-md-5\">\n      <div class=\"card\">\n        <div class=\"card-header bg-primary text-white text-center\">\n          <h4><i class=\"fa fa-sign-in\"></i> Login</h4>\n          <p style=\"margin: 0; font-size: 13px;\">BAMUL Customer Master Portal</p>\n        </div>\n        <div class=\"card-body\" style=\"padding: 30px;\">\n          <form [formGroup]=\"loginForm\" (ngSubmit)=\"onLogin()\">\n\n            <div class=\"form-group\">\n              <label>Username</label>\n              <input type=\"text\" class=\"form-control\" formControlName=\"username\" placeholder=\"Enter EBS username (e.g. SYSADMIN)\">\n            </div>\n\n            <div class=\"form-group\">\n              <label>Password</label>\n              <input type=\"password\" class=\"form-control\" formControlName=\"password\" placeholder=\"Enter password\">\n            </div>\n\n            <div *ngIf=\"errorMessage\" class=\"alert alert-danger\" style=\"font-size: 13px;\">\n              <i class=\"fa fa-exclamation-circle\"></i> {{ errorMessage }}\n            </div>\n\n            <button type=\"submit\" class=\"btn btn-primary btn-block\" [disabled]=\"loginForm.invalid || loading\">\n              <i class=\"fa fa-sign-in\" *ngIf=\"!loading\"></i>\n              <i class=\"fa fa-spinner fa-spin\" *ngIf=\"loading\"></i>\n              {{ loading ? 'Logging in...' : 'Login' }}\n            </button>\n\n          </form>\n          <div class=\"text-center\" style=\"margin-top: 15px;\">\n            <p style=\"font-size: 13px; color: #666;\">Don't have an account? <a routerLink=\"/register\" style=\"color: #1a73e8; font-weight: 600;\">Register Here</a></p>\n            <p style=\"font-size: 13px; color: #666;\"><a routerLink=\"/reset-password\" style=\"color: #1a73e8; font-weight: 600;\">Reset Password</a></p>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n"
