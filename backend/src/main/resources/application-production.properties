spring.application.name=bamul-customer-master
server.port=9092

# ======================
# ORACLE DATASOURCE - Production Oracle
# ======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//129.159.231.57:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bamul}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Bamul2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ======================
# EMAIL (Gmail SMTP)
# ======================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=guhashibashish@gmail.com
spring.mail.password=suonkwrzquqwijkg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notification.admin.email=guhashibashish@gmail.com

# ======================
# JPA / HIBERNATE
# ======================
spring.jpa.database-platform=org.hibernate.dialect.Oracle10gDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.proc.param_null_passing=true

# ======================
# LOGGING
# ======================
logging.level.root=INFO
logging.level.com.bamul=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Log to file
logging.file.name=/app/logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# ======================
# SERVER CONFIGURATION
# ======================
server.tomcat.relaxed-query-chars=|,{,},[,]
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.connection-timeout=20000
spring.mvc.dispatch-options-request=true

# ======================
# ACTUATOR (for health checks)
# ======================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ======================
# SECURITY
# ======================
server.error.include-stacktrace=never
server.error.include-message=never